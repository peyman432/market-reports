name: telegram-publisher

on:
  schedule:
    # فقط «شروع‌کننده»: یک اجرا کل جلسه‌ی بازار را خودش هر ۵ دقیقه می‌چرخد (حالت --loop).
    # چند زمان شروع پشتیبان هست تا اگر GitHub یکی را دیر اجرا کرد یا حذف کرد، بقیه جایگزین شوند.
    # ساعت‌ها UTC هستند: 05:10 = 08:40 تهران. روزها: شنبه تا چهارشنبه (6,0,1,2,3).
    - cron: "10 5 * * 6,0-3"
    - cron: "25 5 * * 6,0-3"
    - cron: "40 5 * * 6,0-3"
    - cron: "55 5 * * 6,0-3"
    - cron: "15 6 * * 6,0-3"
    - cron: "45 6 * * 6,0-3"
  workflow_dispatch:
    inputs:
      force:
        description: "ارسال اجباری یک‌باره (بدون توجه به ساعت و تازگی داده)"
        type: boolean
        default: false
      reset:
        description: "شروع از نو: پیام‌های قبلی ربات پاک و همه‌ی پیام‌ها به ترتیب دوباره ارسال شوند (اجباری هم هست)"
        type: boolean
        default: false

# اجرای زمان‌بندی‌شده هرگز جلسه‌ی در حال اجرا را قطع نمی‌کند؛ اجرای دستی قطع می‌کند
# (اجرای دستی بدون تیک = راه‌اندازی دوباره‌ی جلسه)
concurrency:
  group: telegram
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # حداکثر ۵ ساعت و نیم (جلسه‌ی بازار حدود ۴ ساعت و ربع است)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: فونت فارسی
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-vazirmatn || sudo apt-get install -y -qq fonts-noto-core

      - run: pip install -r requirements.txt

      # شناسه‌ی پیام‌های امروز (برای ویرایش به‌جای ارسال مجدد)
      - uses: actions/cache/restore@v4
        with:
          path: tg_state.json
          key: tg-state-none
          restore-keys: tg-state-

      - name: انتشار در تلگرام
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SITE_URL: https://peyman432.github.io/market-reports/data.json
        run: python tg_from_site.py ${{ inputs.force && '--force' || '' }} ${{ inputs.reset && '--reset' || '' }} ${{ (inputs.force == true || inputs.reset == true) && '--single' || '--loop' }}

      - uses: actions/cache/save@v4
        if: ${{ always() && hashFiles('tg_state.json') != '' }}
        with:
          path: tg_state.json
          key: tg-state-${{ github.run_id }}
